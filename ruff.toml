target-version = "py312"

[lint]
# See https://docs.astral.sh/ruff/rules/
# Preview rules are only enabled when selected by their full code, like S401 below.
preview = true
explicit-preview-rules = true
select = [
    "B",     # flake8-bugbear (catches likely bugs)
    "C4",    # flake8-comprehensions
    "D2",    # pydocstyle (D2xx)
    "D3",    # pydocstyle (D3xx)
    "D4",    # pydocstyle (D4xx)
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "FURB",  # Refactoring suggestions
    "I",     # isort
    "LOG",   # Logging best practices
    "NPY",   # NumPy-specific rules
    "PD",    # pandas-vet
    "PERF",  # Performance anti-patterns
    "PGH004",  # blanket-noqa (a noqa must name the rules it ignores)
    "PLE2502",  # bidirectional-unicode (trojan source)
    "PTH",   # flake8-use-pathlib (prefer pathlib over os.path)
    "RUF",   # Ruff-specific rules
    "S",     # flake8-bandit (security issues)
    # Bandit's import checks, preview rules in ruff, only used for the QGIS plugin
    "S401", "S402", "S403", "S405", "S406", "S407", "S408", "S409", "S412", "S413",
    "SIM",   # flake8-simplify (code simplification)
    "UP",    # pyupgrade
    "W605",  # invalid-escape-sequence
]
ignore = [
    "E501",   # line-too-long
    "PD002",  # inplace argument
]
fixable = ["ALL"]

[lint.per-file-ignores]
# plugins.qgis.org scans uploaded plugins with Bandit and blocks them on any finding,
# so the code shipped in the QGIS plugin cannot ignore these. Bandit does not read
# `# noqa`, so a reviewed finding there needs both: `# noqa: S603  # nosec B603`.
"!ribasim_qgis/**" = [
    "S101",  # assert - used extensively in tests and validation
    "S4",    # suspicious imports - only checked for the QGIS plugin
    "S603",  # subprocess-without-shell-equals-true - false positives with trusted input
    "S607",  # start-process-with-partial-path - CLI paths are intentional
]
"ribasim_qgis/{scripts,tests}/**" = ["S101", "S4", "S603", "S607"]

[lint.pydocstyle]
convention = "numpy"
