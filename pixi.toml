[workspace]
name = "Ribasim"
version = "2026.1.2"
description = "Water resources modeling"
authors = ["Deltares and contributors <ribasim.info@deltares.nl>"]
channels = ["conda-forge", "https://prefix.dev/julia-forge"]
platforms = [
    "win-64",
    "linux-64",
    # The macOS version also sets the PyPI wheel tags, the netCDF4 wheels need 15.0
    { name = "osx-arm64-15", platform = "osx-arm64", macos = "15.0" },
    "linux-aarch64",
]
readme = "README.md"
license = "MIT"
license-file = "LICENSE"
homepage = "https://ribasim.org/"
documentation = "https://ribasim.org/"
repository = "https://github.com/Deltares/Ribasim"

[tasks]
# Tests
test-ribasim-python = "pytest --basetemp=python/ribasim/tests/temp --numprocesses=4 -m 'not regression' python/ribasim/tests"
test-ribasim-python-cov = "pytest --numprocesses=4 --cov=ribasim --cov-report=xml -m 'not regression' python/ribasim/tests"
test-ribasim-api = "pytest -p no:pytest_qgis --basetemp=python/ribasim_api/tests/temp --junitxml=report.xml python/ribasim_api/tests"
# Installation
# This is only for developers who want their global Julia to use the right version.
# Use `pixi run julia` for the package used by CI.
install-julia = "juliaup add 1.13.1 && juliaup override set 1.13.1"
_prek-install = "prek install --overwrite"
instantiate-formatting = { cmd = "julia --startup-file=no --project=utils/formatting --eval 'using Pkg; Pkg.instantiate()'" }
install-prek = { depends-on = [
    "_prek-install",
    "instantiate-formatting",
] }
install = { depends-on = [
    "install-qgis-plugins",
    "install-prek",
    "instantiate-julia",
] }
# Julia
update-manifest-julia = { cmd = "julia --startup-file=no --project utils/update-manifest.jl" }
instantiate-julia = { cmd = "julia --startup-file=no --project --eval='using Pkg; Registry.update(); Pkg.instantiate()'" }
initialize-julia-test = { cmd = "julia --startup-file=no --project=core --eval 'using Pkg; Pkg.test(allow_reresolve=false, test_args=[\"skip\"])'", depends-on = [
    "instantiate-julia",
] }
# Docs
quartodoc-build = { cmd = "quartodoc build && rm objects.json", cwd = "docs", inputs = [
    "docs/_quarto.yml",
    "python/ribasim",
], outputs = [
    "docs/reference/python",
] }
quarto-check = { cmd = "quarto check all", depends-on = ["quartodoc-build"] }
quarto-render = { cmd = "PYTHON_JULIAPKG_PROJECT=$PIXI_PROJECT_ROOT quarto render docs/{{path}}", args = [
    { "arg" = "path", "default" = "" },
], depends-on = [
    "quartodoc-build",
    "generate-testmodels",
    "instantiate-julia",
], env = { "PYTHON_JULIACALL_CHECK_BOUNDS" = "yes", "PYTHON_JULIACALL_HANDLE_SIGNALS" = "yes", "PYTHON_JULIACALL_STARTUP_FILE" = "no", "PYTHON_JULIAPKG_OFFLINE" = "yes" } }
# Publish pre-rendered docs to ribasim.org; should normally only run on CI on main
quarto-publish = { cmd = "quarto publish gh-pages --no-render --no-prompt --no-browser", cwd = "docs", env = { "PRE_COMMIT_ALLOW_NO_CONFIG" = "1" } }
docs = { cmd = "PYTHON_JULIAPKG_PROJECT=$PIXI_PROJECT_ROOT quarto preview docs/{{path}}", args = [
    { "arg" = "path", "default" = "" },
], depends-on = [
    "quartodoc-build",
    "generate-testmodels",
    "instantiate-julia",
], env = { "PYTHON_JULIACALL_CHECK_BOUNDS" = "yes", "PYTHON_JULIACALL_HANDLE_SIGNALS" = "yes", "PYTHON_JULIACALL_STARTUP_FILE" = "no", "PYTHON_JULIAPKG_OFFLINE" = "yes" } }
# Lint
typecheck = "ty check"
check = "prek run --all-files"
# First one can fix issues, second one is to check if all are fixed
fix-check = "prek run --all-files || prek run --all-files"
lint = { depends-on = ["check"] }
# Build
build = { "cmd" = "julia --startup-file=no --project build/build.jl", depends-on = [
    "generate-testmodels",
    "instantiate-julia",
] }
# Tests
s3-download = { cmd = "python utils/s3_download.py {{ remote }} {{ local }}", args = [
    "remote",
    "local",
] }
s3-upload = { cmd = "python utils/s3_upload.py {{ source }} {{ destination }}", args = [
    "source",
    "destination",
] }
test-ribasim-cli = "pytest -p no:pytest_qgis --numprocesses=4 --basetemp=build/tests/temp --junitxml=report.xml build/tests"
test-ribasim-core = { cmd = "julia --startup-file=no --project=core --eval 'using Pkg; Pkg.test(allow_reresolve=false)'", depends-on = [
    "generate-testmodels",
] }
test-ribasim-migration = { cmd = "pytest --numprocesses=4 -m regression python/ribasim/tests", depends-on = [
    { task = "s3-download", args = [
        "hws_migration_test/",
        "hws_migration_test/",
    ] },
] }
test-ribasim-core-cov = { cmd = "julia --startup-file=no --project=core --eval 'using Pkg; Pkg.test(allow_reresolve=false, coverage=true)'", depends-on = [
    "generate-testmodels",
] }
test-ribasim-regression = { cmd = "julia --startup-file=no --project=core --eval 'using Pkg; Pkg.test(allow_reresolve=false, test_args=[\"regression\"])'", depends-on = [
    "generate-testmodels",
    "test-ribasim-migration",
    { task = "s3-download", args = [
        "benchmark/",
        "benchmark/",
    ] },
] }
generate-testmodels = { cmd = "python utils/generate-testmodels.py {{name}}", inputs = [
    "python/ribasim/ribasim",
    "python/ribasim_testmodels",
    "utils/generate-testmodels.py",
], args = [
    { "arg" = "name", "default" = "" },
], outputs = [
    "generated_testmodels/{{name}}",
] }
write-node-icons = "python utils/write_node_icons.py"
upload-node-icons = "python utils/write_node_icons.py --upload"
tests = { depends-on = ["lint", "test-ribasim-python", "test-ribasim-core"] }
delwaq = { cmd = "pytest --basetemp=python/ribasim/ribasim/delwaq/model python/ribasim/tests/test_delwaq.py" }
gen-delwaq = { cmd = "python python/ribasim/ribasim/delwaq/generate.py" }
parse-delwaq = { cmd = "python python/ribasim/ribasim/delwaq/parse.py" }
model-integration-test = { cmd = "julia --startup-file=no --project=core --eval 'using Pkg; Pkg.test(allow_reresolve=false, test_args=[\"integration\"])'", depends-on = [
    { task = "s3-download", args = [
        "hws_2025_4_0/",
        "hws/",
    ] },
] }
# Codegen
codegen = { cmd = "julia --startup-file=no --project utils/gen_python.jl && ruff format python/ribasim/ribasim/schemas.py python/ribasim/ribasim/validation.py", depends-on = [
    "instantiate-julia",
], inputs = [
    "core",
    "utils",
], outputs = [
    "python/ribasim/ribasim/schemas.py",
    "python/ribasim/ribasim/validation.py",
] }
# Publish
build-ribasim-python-wheel = { cmd = "rm --recursive --force dist && hatch build && twine check dist/*", cwd = "python/ribasim" }
build-ribasim-api-wheel = { cmd = "rm --recursive --force dist && hatch build && twine check dist/*", cwd = "python/ribasim_api" }
build-wheels = { depends-on = [
    "build-ribasim-python-wheel",
    "build-ribasim-api-wheel",
] }
publish-ribasim-python = { cmd = "twine upload dist/*", cwd = "python/ribasim", depends-on = [
    "build-ribasim-python-wheel",
] }
publish-ribasim-api = { cmd = "twine upload dist/*", cwd = "python/ribasim_api", depends-on = [
    "build-ribasim-api-wheel",
] }


test-ribasim-qgis-docker = { cmd = "sh ./test.sh", cwd = ".docker" }
test-ribasim-qgis = { cmd = "pytest --basetemp=ribasim_qgis/tests/temp ribasim_qgis", depends-on = [
    "install-ribasim-qgis",
] }

# Run
ribasim-core = { cmd = "julia --startup-file=no --project=core -e 'using Ribasim; Ribasim.main(ARGS)'", depends-on = [
    "instantiate-julia",
] }
ribasim-core-testmodels = { cmd = "julia --startup-file=no --project utils/testmodelrun.jl {{name}}", args = [
    { "arg" = "name", "default" = "" },
], depends-on = [
    { task = "generate-testmodels", args = [
        "{{name}}",
    ] },
    "instantiate-julia",
] }
write-allocation-problems = { cmd = "julia --startup-file=no --project utils/write_allocation_problems.jl", depends-on = [
    "generate-testmodels",
    "instantiate-julia",
] }
migrate-model = "python utils/migrate_model.py"
filter-model = "python utils/filter_model.py"
# Release
github-release = "python utils/github-release.py"

# QGIS
[tasks.qgis]
args = [{ "arg" = "profiles_path", "default" = ".qgis-settings" }]
cmd = "qgis --profiles-path {{ profiles_path }}"

[tasks.install-ribasim-qgis]
args = [
    { "arg" = "profile_path", "default" = ".qgis-settings/profiles/default" },
]
cmd = "python ribasim_qgis/scripts/install_ribasim_qgis.py {{ profile_path }}"

[tasks.install-qgis-plugin]
args = [
    { "arg" = "package" },
    { "arg" = "package_name" },
    { "arg" = "profile_path", "default" = ".qgis-settings/profiles/default" },
]
cmd = "python ribasim_qgis/scripts/install_qgis_plugin.py {{ package }} {{ profile_path }} && python ribasim_qgis/scripts/enable_plugin.py {{ package_name }} {{ profile_path }}"

[tasks.install-qgis-plugins]
args = [
    { "arg" = "profile_path", "default" = ".qgis-settings/profiles/default" },
]
depends-on = [
    { "task" = "install-qgis-plugin", "args" = [
        "Plugin\\ Reloader",
        "plugin_reloader",
        " {{ profile_path }} ",
    ] },
    { "task" = "install-ribasim-qgis", "args" = [
        " {{ profile_path }} ",
    ] },
    { "task" = "install-qgis-plugin", "args" = [
        "QGIS\\ DevTools",
        "devtools",
        " {{ profile_path }} ",
    ] },
]

[tasks.generate-sbom-ribasim-core]
cmd = "julia --startup-file=no --project -- utils/generate-sbom.jl"
depends-on = ["instantiate-julia"]
inputs = ["core/Project.toml"]
outputs = ["Ribasim.spdx.json"]

[tasks.generate-sbom-ribasim-python-noarch]
args = [{ "arg" = "path_sep" }]
cmd = "sbom4python -m ribasim --system --sbom spdx --format json --output Ribasim-python.spdx.json"
env = { "PATH" = "$PATH$path_sep$CONDA_PREFIX/Lib/site-packages/magic/libmagic" }
inputs = ["python/ribasim/pyproject.toml"]
outputs = ["Ribasim-python.spdx.json"]

[target.win.tasks]
add-ribasim-icon = { cmd = "rcedit build/ribasim/bin/ribasim.exe --set-icon docs/assets/ribasim.ico" }

[[target.win.tasks.generate-sbom-ribasim-python.depends-on]]
task = "generate-sbom-ribasim-python-noarch"
args = [";"]

[[target.linux.tasks.generate-sbom-ribasim-python.depends-on]]
task = "generate-sbom-ribasim-python-noarch"
args = [":"]

[[target.osx.tasks.generate-sbom-ribasim-python.depends-on]]
task = "generate-sbom-ribasim-python-noarch"
args = [":"]

[target.linux-aarch64.tasks]
# Override docs task to be a no-op on ARM64 Linux where Quarto doesn't work
docs = { cmd = "echo 'Skipping docs build on ARM64 Linux (Quarto not supported)'" }
quarto-check = { cmd = "echo 'Skipping quarto check on ARM64 Linux (Quarto not supported)'" }
quarto-render = { cmd = "echo 'Skipping quarto render on ARM64 Linux (Quarto not supported)'" }

# Only Python and tools that are not on PyPI come from conda-forge.
# Dependencies of the Python packages go in python/*/pyproject.toml.
[dependencies]
gh = "*"
julia = { version = "==1.13.1", channel = "https://prefix.dev/julia-forge" }
rust = "*"
# The yamlfmt on PyPI is an unrelated project
yamlfmt = "*"

[pypi-dependencies]
ribasim = { path = "python/ribasim", editable = true, extras = ["all"] }
ribasim_api = { path = "python/ribasim_api", editable = true }
ribasim_testmodels = { path = "python/ribasim_testmodels", editable = true }
# Lint and typecheck
nbstripout = "*"
pandas-stubs = "*"
prek = "*"
pyqt5-stubs = "*"
ruff = "*"
ty = "*"
types-geopandas = "*"
types-networkx = "*"
typos = "*"
# Tests
lxml = "*"
pytest-qgis = ">=4.0.1, <5"
# Docs
griffe = ">=1, <2"
juliacall = "==0.9.36"
jupyter = "*"
plotly = "*"
quartodoc = "*"
# QGIS
qgis-plugin-manager = ">=1.7.2"
# Data
dvc = "*"
dvc-s3 = "*"
minio = "*"
python-dotenv = "*"
# Build and release
hatch = "*"
hatchling = "*"
python-magic = ">=0.4.27"
sbom4python = ">=0.12.3"
twine = "*"
# Debugging
debugpy = "*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.pandas2.pypi-dependencies]
pandas = ">=2.2,<3"

# Online coupling of Wflow and Ribasim, see wflow-coupled/README.md
# This is a separate lightweight environment without the default feature,
# such that hydromt-ribasim, which is not yet public, does not affect the other environments.
[feature.wflow-coupled]
platforms = ["win-64", "linux-64"]

[feature.wflow-coupled.dependencies]
julia = { version = "==1.13.1", channel = "https://prefix.dev/julia-forge" }
python = "3.13.*"

[feature.wflow-coupled.pypi-dependencies]
hydromt-ribasim = { git = "https://github.com/Deltares-research/hydromt_ribasim.git", rev = "0c4018fced8d478215f3a02d1885a5fc92eaa40e" }
ribasim = { path = "python/ribasim", editable = true }
# affine>=3.0 dropped tuple subclassing, which breaks numba typing in pyflwdir
affine = "<3"

# hydromt-ribasim pins ribasim to a git revision, use the one from this repository instead
[feature.wflow-coupled.pypi-options.dependency-overrides]
ribasim = { path = "python/ribasim", editable = true }

[feature.wflow-coupled.tasks]
wflow-coupled-instantiate-julia = "julia --startup-file=no --project=wflow-coupled --eval='using Pkg; Registry.update(); Pkg.instantiate()'"
wflow-coupled-build-wflow = { cmd = "python build_piave_wflow.py", cwd = "wflow-coupled" }
wflow-coupled-build-ribasim = { cmd = "python build_piave_ribasim.py", cwd = "wflow-coupled", depends-on = [
    "wflow-coupled-build-wflow",
] }
wflow-coupled-build-mapping = { cmd = "julia --startup-file=no --project=wflow-coupled wflow-coupled/build_mapping.jl", depends-on = [
    "wflow-coupled-instantiate-julia",
    "wflow-coupled-build-ribasim",
] }
wflow-coupled-prepare = { depends-on = ["wflow-coupled-build-mapping"] }
wflow-coupled-run = { cmd = "julia --startup-file=no --project=wflow-coupled wflow-coupled/online.jl", depends-on = [
    "wflow-coupled-instantiate-julia",
] }

[target.win-64.dependencies]
rcedit = "*"
qgis = ">=3.40,<4"
quarto = "*"
# QGIS brings the conda libarrow, whose arrow.dll would be loaded instead of the one in the
# pyarrow wheel, making `import pyarrow` fail. So use the conda pyarrow built against it.
pyarrow = "*"

[target.linux-64.dependencies]
qgis = ">=3.40,<4"
quarto = "*"

[target.osx-arm64.dependencies]
quarto = "*"

[target.unix.activation]
scripts = ["scripts/load-env.sh"]

[target.win.activation]
scripts = ["scripts/load-env.bat"]

[environments]
default = ["py313"]
py312 = ["py312"]
pandas2 = ["py313", "pandas2"]
wflow-coupled = { features = ["wflow-coupled"], no-default-feature = true }

[activation.env]
JULIA_CONDAPKG_BACKEND = "Null"
