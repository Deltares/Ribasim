# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

exclude = "core/test/data/allocation_problems"

[[repos]]
repo = "builtin"
hooks = [
  {
    id = "check-added-large-files",
    exclude = 'ribasim_qgis/widgets/plotly-.*\.min\.js'
  },
  { id = "check-case-conflict" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-json" },
  { id = "check-xml" },
  { id = "mixed-line-ending" },
  { id = "fix-byte-order-marker" },
  { id = "detect-private-key" },
  { id = "check-symlinks" },
  { id = "check-merge-conflict" },
  {
    id = "end-of-file-fixer",
    exclude = ".teamcity"
  },
  { id = "trailing-whitespace" }
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
description = "Lint Python code and auto-fix issues"
entry = "pixi run ruff check --force-exclude"
args = ["--fix"]
language = "system"
types_or = [
  "python",
  "pyi",
  "jupyter"
]
require_serial = true

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
description = "Format Python code"
entry = "pixi run ruff format --force-exclude"
language = "system"
types_or = [
  "python",
  "pyi",
  "jupyter"
]
require_serial = true

# plugins.qgis.org scans uploaded plugins with Bandit and detect-secrets, and blocks
# them on any finding. ruff checks the Bandit rules (see ruff.toml), these two hooks
# cover the rest for the files shipped in the QGIS plugin.
[[repos.hooks]]
id = "qgis-plugin-nosec"
name = "QGIS plugin: noqa of a Bandit rule also needs nosec"
description = "Bandit ignores `# noqa: S603`, add `# nosec B603` as well"
language = "pygrep"
entry = '^(?!.*\bnosec\b).*\bnoqa:[^#]*\bS\d{3}'
files = '^ribasim_qgis/'
exclude = '^ribasim_qgis/(scripts|tests)/'
types = ["python"]

[[repos.hooks]]
id = "qgis-plugin-detect-secrets"
name = "QGIS plugin: detect-secrets"
description = "Look for secrets with the detect-secrets plugins that plugins.qgis.org uses"
entry = "pixi run detect-secrets-hook --disable-plugin IPPublicDetector"
language = "system"
# ribasim_qgis/core/styles links to python/ribasim/ribasim/styles
files = '^(ribasim_qgis/|python/ribasim/ribasim/styles/)'
exclude = '^ribasim_qgis/(scripts/|tests/|metadata\.txt$)'
types = ["text"]

[[repos.hooks]]
id = "yamlfmt"
name = "yamlfmt"
description = "Format YAML files"
entry = "pixi run yamlfmt"
language = "system"
types = ["yaml"]

[[repos.hooks]]
id = "nbstripout"
name = "nbstripout"
description = "Strip Jupyter notebook outputs"
entry = "pixi run nbstripout"
language = "system"
types = ["jupyter"]

[[repos.hooks]]
id = "typos"
name = "typos"
description = "Fix spelling mistakes"
language = "system"
entry = "pixi run typos"
args = [
  "--write-changes",
  "--force-exclude"
]
types = ["text"]
stages = [
  "pre-commit",
  "pre-merge-commit",
  "pre-push",
  "manual"
]

[[repos.hooks]]
id = "typecheck"
name = "typecheck"
entry = "pixi run typecheck"
pass_filenames = false
language = "system"

[[repos.hooks]]
id = "runic"
name = "runic"
description = "Format Julia code"
entry = "pixi run julia --project=utils/formatting --startup-file=no --module Runic"
args = [
  "--docstrings",
  "--diff",
  "--inplace"
]
language = "system"
types = ["julia"]
