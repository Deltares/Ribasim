# Configuration for the dead link check on the rendered docs, see .github/workflows/docs.yml
no_progress = true
# Only fail on definitive errors, not on bot blocking, rate limiting or temporarily unavailable servers
accept = ["200..=299", "401", "403", "429", "502", "503", "504"]
max_retries = 3
retry_wait_time = 5
accept_timeouts = true
timeout = 30
exclude_path = ["docs/_site/search.json"]
# docs/_site is gitignored, and lychee would otherwise skip it
no_ignore = true
# Links that only resolve once the docs are published or that block bots
exclude = [
    '^https?://localhost',
    '^https?://127\.0\.0\.1',
    '^https://ribasim\.org',
    # Quarto links this stylesheet in pages with diagrams, but does not write it
    'quarto-diagram/mermaid\.css$',
    # Quarto adds a .png extension to this embedded GitHub attachment, which then 404s
    '^https://github\.com/Deltares/Ribasim/assets/',
    # Dead link in references.bib, the new location of this page has to be looked up
    '^https://www\.pdok\.nl/downloads/-/article/basisregistratie-topografie-brt-topnl',
]
