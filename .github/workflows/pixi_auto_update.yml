name: Update Pixi lockfile
permissions:
  contents: read
on:
  schedule:
    # At 03:00 on day 3 of the month
    - cron: "0 3 3 * *"
  # on demand
  workflow_dispatch:
jobs:
  pixi-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: "latest"
          run-install: false
      - name: Update lockfiles
        run: |
          set -o pipefail
          # The wflow-coupled environment is left out since hydromt-ribasim is not yet public
          pixi update --environment default --environment min --environment qgis --json | pixi exec pixi-diff-to-markdown >> diff.md
          pixi run generate-sbom-ribasim-python
      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.CI_PR_PAT }}
          commit-message: Update pixi lockfile
          title: Update pixi lockfile
          body-path: diff.md
          branch: update/pixi-lock
          base: main
          delete-branch: true
          add-paths: pixi.lock, Ribasim-python.spdx.json
