name: QGIS Tests
on:
  push:
    branches: [main]
    paths: ["ribasim_qgis/**", ".docker/**", ".github/workflows/qgis.yml", "pixi.toml", "pixi.lock", "ty.toml"]
    tags: ["*"]
  pull_request:
    paths: ["ribasim_qgis/**", ".docker/**", ".github/workflows/qgis.yml", "pixi.toml", "pixi.lock", "ty.toml"]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-qgis:
    name: "Test (${{ matrix.image }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - qgis/qgis:3.44
          - qgis/qgis:4.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run tests
        # Same script as `pixi run test-ribasim-qgis-docker <image>`
        run: bash .docker/test.sh ${{ matrix.image }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  typecheck-qgis:
    name: "Typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: "latest"
          environments: qgis
      - name: Typecheck
        run: pixi run typecheck-qgis
