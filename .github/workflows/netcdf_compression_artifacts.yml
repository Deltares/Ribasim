# Temporary workflow for issue #3358, remove before merging.
name: NetCDF compression artifacts
on:
  push:
    branches: [netcdf-quantize-zstd]
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: "latest"
          activate-environment: true
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0
      - name: Generate basic model
        run: pixi run generate-testmodels basic
      - name: Instantiate Julia
        run: pixi run instantiate-julia
      - name: Run compression variants
        run: |
          export HDF5_PLUGIN_PATH="$CONDA_PREFIX/lib/hdf5/plugin"
          julia --startup-file=no --project=core utils/netcdf-compression/run_variants.jl generated_testmodels/basic netcdf-compression-basic
          cp utils/netcdf-compression/README.md netcdf-compression-basic/
      - name: Check variants
        run: python utils/netcdf-compression/check.py netcdf-compression-basic
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: netcdf-compression-basic
          path: netcdf-compression-basic
          retention-days: 30
