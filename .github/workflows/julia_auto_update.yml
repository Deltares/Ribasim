name: Julia auto update
on:
  schedule:
    # At 03:00 on day 2 of the month
    - cron: "0 3 2 * *"
  # on demand
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auto-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: "latest"
      - name: Update Julia manifest file
        run: |
          pixi run update-manifest-julia
          pixi run generate-sbom-ribasim-core
          pixi run install-prek
          pixi run fix-check
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.CI_PR_PAT }}
          branch: update/julia-manifest
          title: Update Julia manifest
          commit-message: "Update Julia manifest"
          body-path: .pixi/update-manifest-julia.md
          author: "GitHub <noreply@github.com>"
