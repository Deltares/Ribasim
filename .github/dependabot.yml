# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-actions:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/build/cli"
    schedule:
      interval: "monthly"
    groups:
      all-cargo-packages:
        patterns:
          - "*"
